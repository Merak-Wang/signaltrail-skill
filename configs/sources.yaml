# Runtime settings inherit the defaults in signaltrail.config.
browser:
  profile_dir_env: DAILY_INTEL_PROFILE_DIR
  channel_env: DAILY_INTEL_BROWSER_CHANNEL
output:
  copy_html_to_desktop: true
media:
  request_timeout_seconds: 10
monitor:
  request_timeout_seconds: 10
sources:
  # Omitted source fields inherit SourceConfig defaults.
- id: weibo_hot
  name: Weibo Hot Search
  mode: weibo_api
  url: https://m.weibo.cn/api/container/getIndex?containerid=106003type%3D25%26t%3D3%26disable_hot%3D1%26filter_type%3Drealtimehot
  explore_urls:
  - https://60s.viki.moe/v2/weibo
  include_domains: [m.weibo.cn, weibo.com, 60s.viki.moe]
  max_items: 50
  role: discovery
  category: domestic
  language: zh
  region: cn
- id: yicai_economy
  name: 第一财经
  url: https://www.yicai.com/news/
  include_domains:
  - yicai.com
  max_items: 80
  article_patterns:
  - ^https://www\.yicai\.com/news/\d+\.html$
  exclude_patterns:
  - /video/
  - /brief/
  - /image/
  content_selectors:
  - .m-text
  - article
  - main article
  - main
  category: market
  language: zh
  region: cn
- id: sec_edgar_latest
  name: SEC EDGAR Latest Filings
  url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&count=100
  feed_urls:
  - https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=&company=&dateb=&owner=include&count=100&output=atom
  include_domains:
  - sec.gov
  max_items: 100
  role: primary
  article_patterns:
  - ^https://www\.sec\.gov/Archives/edgar/data/\d+/\d+/.+-index\.html?$
  exclude_patterns:
  - /ixviewer/
  content_selectors:
  - article
  - main
  - body
  category: market
  region: us
- id: hacker_news
  name: Hacker News
  url: https://news.ycombinator.com/
  feed_urls:
  - https://hnrss.org/frontpage
  role: discovery
  article_patterns:
  - ^https?://.+
  exclude_patterns:
  - ^https?://news\.ycombinator\.com/
  module: technology
  category: news
- id: lobsters
  name: Lobsters
  url: https://lobste.rs/
  feed_urls:
  - https://lobste.rs/rss
  role: discovery
  article_patterns:
  - ^https?://.+
  exclude_patterns:
  - ^https?://(?:www\.)?lobste\.rs/
  - ^https?://web\.archive\.org/web/
  module: technology
  category: news
- id: infoq_ai
  name: InfoQ AI, ML and Data Engineering
  url: https://www.infoq.com/ai-ml-data-eng/
  feed_urls:
  - https://feed.infoq.com/ai-ml-data-eng/
  include_domains:
  - infoq.com
  article_patterns:
  - ^https://www\.infoq\.com/(?:news/\d{4}/\d{2}/|articles/)[^/?#]+/?$
  exclude_patterns:
  - /presentations/
  - /podcasts/
  content_selectors: &article_selectors
  - article
  - main article
  - main
  module: technology
  category: news
- id: anthropic_research
  name: Anthropic Research
  url: https://www.anthropic.com/research
  include_domains:
  - anthropic.com
  max_items: 40
  article_patterns:
  - ^https://www\.anthropic\.com/research/.+
  exclude_patterns:
  - /authors?/
  - /research/team/
  content_selectors: *article_selectors
  module: technology
  category: papers
- id: openai_publications
  name: OpenAI Publications
  url: https://openai.com/zh-Hans-CN/research/index/publication/
  feed_urls:
  - https://openai.com/news/rss.xml
  include_domains:
  - openai.com
  max_items: 50
  role: primary
  article_patterns:
  - ^https://openai\.com/(zh-Hans-CN/)?research/.+
  - ^https://openai\.com/(zh-Hans-CN/)?index/.+
  exclude_patterns:
  - /research/index/publication/?$
  - /policies/
  - /about/
  content_selectors: *article_selectors
  module: technology
  category: papers
  language: multi
- id: deepmind_publications
  name: Google DeepMind Publications
  url: https://deepmind.google/research/publications/
  include_domains:
  - deepmind.google
  role: primary
  article_patterns:
  - ^https://deepmind\.google/research/publications/[^/#?]+/?$
  exclude_patterns:
  - /research/publications/?$
  content_selectors: *article_selectors
  module: technology
  category: papers
- id: huggingface_papers
  name: Hugging Face Papers
  url: https://huggingface.co/papers/trending
  include_domains:
  - huggingface.co
  role: discovery
  article_patterns:
  - ^https://huggingface\.co/papers/\d{4}\.\d{4,6}/?$
  exclude_title_patterns:
  - '(?i)^View paper$'
  exclude_patterns:
  - /papers/month/?$
  - /papers/trending/?$
  module: technology
  category: papers
- id: papers_with_code
  name: Papers with Code / Hugging Face
  url: https://paperswithcode.com/
  include_domains:
  - paperswithcode.com
  - huggingface.co
  role: discovery
  article_patterns:
  - ^https://huggingface\.co/papers/\d{4}\.\d{4,6}/?$
  exclude_patterns:
  - /papers/month/?$
  - /papers/trending/?$
  module: technology
  category: papers
- id: google_research_publications
  name: Google Research Publications
  url: https://research.google/pubs/
  include_domains:
  - research.google
  role: primary
  article_patterns:
  - ^https://research\.google/pubs/[a-z0-9]+(?:-[a-z0-9]+)*/?$
  exclude_patterns:
  - ^https://research\.google/pubs/?$
  content_selectors: *article_selectors
  module: technology
  category: papers
- id: microsoft_research_publications
  name: Microsoft Research Publications
  url: https://www.microsoft.com/en-us/research/publications/
  include_domains:
  - microsoft.com
  role: primary
  article_patterns:
  - ^https://www\.microsoft\.com/(?:en-us/)?research/publication/[^/?#]+/?$
  - ^https://www\.microsoft\.com/(?:en-us/)?research/\?p=\d+$
  exclude_patterns:
  - /research/publications/?$
  content_selectors: *article_selectors
  module: technology
  category: papers
- id: arxiv_ai
  name: arXiv AI Recent
  mode: arxiv_index
  url: https://arxiv.org/list/cs.AI/recent
  feed_urls:
  - https://export.arxiv.org/api/query?search_query=cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=40
  include_domains:
  - arxiv.org
  article_patterns:
  - ^https://arxiv\.org/abs/.+
  exclude_patterns:
  - /list/
  - /search/
  content_selectors:
  - blockquote.abstract
  - main
  module: technology
  category: papers
- id: github_trending
  name: GitHub Trending
  url: https://github.com/trending?since=daily
  include_domains:
  - github.com
  max_items: 40
  role: discovery
  article_patterns:
  - ^https://github\.com/[^/]+/[^/?#]+/?$
  exclude_patterns:
  - ^https://github\.com/(topics|collections|sponsors|marketplace|features|settings|login|signup|open-source|enterprise|solutions|security|resources)/
  - ^https://github\.com/trending(?:/|\?|$)
  module: technology
  category: open_source
- id: cnbc_world
  name: CNBC World
  url: https://www.cnbc.com/world/?region=world
  feed_urls:
  - https://www.cnbc.com/id/100727362/device/rss/rss.html
  include_domains:
  - cnbc.com
  max_items: 80
  article_patterns:
  - ^https://www\.cnbc\.com/20\d{2}/\d{2}/\d{2}/.+\.html$
  exclude_patterns:
  - /quotes/
  - /video/
  - /investingclub/
  - /subscribe
  - /privacy
  - /terms
  content_selectors: *article_selectors
  category: market
- id: reuters
  name: Reuters
  url: https://www.reuters.com/
  explore_urls:
  - https://www.aol.com/news/
  include_domains:
  - reuters.com
  - aol.com
  max_items: 80
  article_patterns:
  - ^https://www\.reuters\.com/(world|business|markets|technology|legal|sustainability|sports)/.+[-/]20\d{2}-\d{2}-\d{2}/?$
  - ^https://www\.aol\.com/articles/[^/?#]+\.html$
  exclude_patterns:
  - /pictures/
  - /graphics/
  - /video/
  - /about/
  content_selectors: *article_selectors
- id: abc_news
  name: ABC News
  url: https://abcnews.com/
  feed_urls:
  - https://abcnews.go.com/abcnews/topstories
  include_domains:
  - abcnews.com
  max_items: 80
  article_patterns:
  - ^https://abcnews\.com/.+/(story|wireStory|live-updates)(/|$)
  exclude_patterns:
  - /Video/
  - /video/
  - /alerts/
  - /Live$
  content_selectors: *article_selectors
  region: us
- id: guardian_uk
  name: The Guardian UK
  url: https://www.theguardian.com/world
  feed_urls:
  - https://www.theguardian.com/world/rss
  explore_urls:
  - https://www.theguardian.com/uk-news
  - https://www.theguardian.com/business
  - https://www.theguardian.com/technology
  - https://www.theguardian.com/science
  include_domains:
  - theguardian.com
  max_items: 80
  article_patterns:
  - ^https://www\.theguardian\.com/[^/]+/20\d{2}/[a-z]{3}/\d{2}/.+
  exclude_patterns:
  - /profile/
  - /help/
  - /info/
  content_selectors: *article_selectors
  region: uk
- id: bbc_world
  name: BBC
  url: https://www.bbc.com/news
  feed_urls:
  - https://feeds.bbci.co.uk/news/world/rss.xml
  explore_urls:
  - https://www.bbc.com/news/world
  - https://www.bbc.com/news/uk
  - https://www.bbc.com/news/business
  - https://www.bbc.com/innovation/technology
  - https://www.bbc.com/innovation/science
  include_domains:
  - bbc.co.uk
  - bbc.com
  max_items: 80
  article_patterns:
  - ^https://www\.bbc\.(?:co\.uk|com)/(?:news|innovation)/(?:articles|article)/.+
  exclude_patterns:
  - /news/videos/
  - /sport/
  - /iplayer/
  - /usingthebbc/
  - /accessibility/
  content_selectors: *article_selectors
- id: forbes
  name: Forbes
  url: https://www.forbes.com/
  feed_urls:
  - https://www.forbes.com/news_sitemap.xml
  - https://www.forbes.com/innovation/feed/
  - https://www.forbes.com/business/feed/
  include_domains:
  - forbes.com
  max_items: 80
  article_patterns:
  - ^https?://www\.forbes\.com/sites/[^/]+/20\d{2}/\d{2}/\d{2}/.+
  exclude_patterns:
  - /subscribe
  - /privacy
  - /terms-and-conditions
  - /newsletters/
  content_selectors: *article_selectors
  category: market
- id: twz
  name: TWZ
  mode: twz_index
  url: https://www.twz.com/latest
  feed_urls:
  - https://www.twz.com/feed
  include_domains:
  - twz.com
  article_patterns:
  - ^https://www\.twz\.com/(air|land|sea|space|news-features)/.+
  exclude_patterns:
  - /authors/
  - /category/
  - /editorial-standards
  content_selectors: *article_selectors
  category: military
- id: the_aviationist
  name: The Aviationist
  url: https://theaviationist.com/articles/
  feed_urls:
  - https://theaviationist.com/feed/
  include_domains:
  - theaviationist.com
  article_patterns:
  - ^https://theaviationist\.com/20\d{2}/\d{2}/\d{2}/.+/?$
  exclude_patterns:
  - /category/
  - /author/
  - /tag/
  content_selectors: *article_selectors
  category: military
- id: usni_news
  name: USNI News
  url: https://news.usni.org/
  feed_urls:
  - https://news.usni.org/feed
  include_domains:
  - news.usni.org
  article_patterns:
  - ^https://news\.usni\.org/20\d{2}/\d{2}/\d{2}/[^/?#]+/?$
  exclude_patterns:
  - /category/
  - /author/
  - /tag/
  content_selectors: *article_selectors
  category: military
  region: us
- id: yahoo_news
  name: Yahoo News
  url: https://www.yahoo.com/news/
  include_domains:
  - yahoo.com
  max_items: 80
  article_patterns:
  - ^https://www\.yahoo\.com/(news|finance)/.+/articles/.+\.html$
  exclude_patterns:
  - /privacy/
  - /all/
  - /weather-news/$
  - guce\.yahoo\.com
  exclude_title_patterns:
  - ^view all comments$
  content_selectors: *article_selectors
  category: market
