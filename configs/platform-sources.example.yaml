# Copy this template to your own config path and add sources under sources.
# Configure your RSSHub instance and any rsshub_route entries for those sources.
# python -m signaltrail.cli --config YOUR_CONFIG.yaml refresh-monitor
timezone: Asia/Shanghai
rsshub:
  base_url: http://127.0.0.1:1200
collection:
  item_order: source
  # Optional: pip install -e ".[crawl4ai]" followed by crawl4ai-setup.
  # Applies only to selected articles whose HTTP extraction needs a browser.
  browser_extractor: playwright
monitor:
  sources_file: null
  auto_discover_feeds: false
  html_fallback: false
sources: []
