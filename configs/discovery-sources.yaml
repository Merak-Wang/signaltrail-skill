sources:
  # Enabled sources contribute to their configured report sections.
  - id: un_news
    article_patterns: ['^https://news\.un\.org/(?:feed/view/)?en/story/\d{4}/\d{2}/\d+']
    name: UN News
    url: https://news.un.org/en/
    feed_urls: [https://news.un.org/feed/subscribe/en/news/all/rss.xml]
    role: primary
    tier: 1
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: international_organization
    coverage_regions: [global]
    publisher_group: united_nations
  - id: al_jazeera
    article_patterns: ['^https://www\.aljazeera\.com/(?:[^/]+/)*\d{4}/\d{1,2}/\d{1,2}/[^/?#]+']
    name: Al Jazeera
    url: https://www.aljazeera.com/
    feed_urls: [https://www.aljazeera.com/xml/rss/all.xml]
    role: evidence
    tier: 1
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: qa
    coverage_regions: [middle_east, global]
    publisher_group: al_jazeera
  - id: tass_en
    name: TASS English
    url: https://tass.com/
    feed_urls: [https://tass.com/rss/v2.xml]
    include_domains: [tass.com]
    article_patterns: ['^https://tass\.com/[a-z-]+/\d+$']
    role: evidence
    tier: 2
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: ru
    coverage_regions: [ru, global]
    publisher_group: tass
  - id: xinhua_en
    name: Xinhua English
    url: https://english.news.cn/
    include_domains: [english.news.cn]
    article_patterns: ['^https://english\.news\.cn/(?:[a-z]+/)?\d{8}/[a-f0-9]+/c\.html$']
    role: evidence
    tier: 2
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: cn
    coverage_regions: [cn, global]
    publisher_group: xinhua
  - id: china_mofcom
    name: 商务部例行新闻发布会
    url: https://www.mofcom.gov.cn/xwfb/
    include_domains: [mofcom.gov.cn]
    article_patterns: ['^https://www\.mofcom\.gov\.cn/xwfbzt/\d{4}/swbzklxxwfbh[^/]+/index\.html$']
    role: primary
    tier: 1
    bundle: markets
    module: information
    category: market
    language: zh
    region: cn
    origin_scope: cn
    coverage_regions: [cn, global]
    publisher_group: china_mofcom
    refresh_interval_minutes: 120
  - id: un_press
    name: UN Meetings Coverage and Press Releases
    url: https://press.un.org/en
    include_domains: [press.un.org]
    article_patterns: ['^https://press\.un\.org/en/\d{4}/[a-z0-9]+\.doc\.htm$']
    role: primary
    tier: 1
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: international_organization
    coverage_regions: [global]
    publisher_group: united_nations
  - id: irna_en
    name: IRNA English
    enabled: false
    url: https://en.irna.ir/
    include_domains: [en.irna.ir]
    article_patterns: ['^https://en\.irna\.ir/news/\d+/[^/?#]+/?$']
    role: evidence
    bundle: geopolitics
    language: en
    region: middle_east
    origin_scope: ir
    coverage_regions: [ir, middle_east, global]
    publisher_group: irna
  - id: wam_en
    name: Emirates News Agency
    enabled: false
    url: https://www.wam.ae/en
    include_domains: [wam.ae]
    role: evidence
    bundle: geopolitics
    language: en
    region: middle_east
    origin_scope: ae
    coverage_regions: [ae, middle_east]
    publisher_group: wam
  - id: dw_world
    article_patterns: ['^https://www\.dw\.com/en/.+/(?:a|av|live)-\d+']
    name: DW
    url: https://www.dw.com/en/top-stories/s-9097
    feed_urls: [https://rss.dw.com/rdf/rss-en-all]
    role: evidence
    tier: 1
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: eu
  - id: nyt_world
    name: The New York Times World
    url: https://www.nytimes.com/section/world
    feed_urls: [https://rss.nytimes.com/services/xml/rss/nyt/World.xml]
    role: evidence
    tier: 1
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: us
  - id: cbc_world
    article_patterns: ['^https://www\.cbc\.ca/(?:[^?#]+-\d\.\d+|player/play/(?:video/)?\d\.\d+)']
    name: CBC World
    url: https://www.cbc.ca/news/world
    feed_urls: [https://www.cbc.ca/cmlink/rss-world]
    role: evidence
    tier: 2
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: ca
  - id: japan_times
    article_patterns: ['^https://www\.japantimes\.co\.jp/[^/]+/\d{4}/\d{2}/\d{2}/']
    name: The Japan Times
    url: https://www.japantimes.co.jp/news/
    feed_urls: [https://www.japantimes.co.jp/feed/]
    role: evidence
    tier: 2
    bundle: asia
    module: information
    category: international
    language: en
    region: jp
  - id: google_news_china
    name: Google News · China
    url: https://news.google.com/
    article_patterns: ['^https://news\.google\.com/(?:rss/articles|read|articles)/[a-zA-Z0-9_-]+/?(?:[?#]|$)']
    feed_urls:
      - https://news.google.com/rss/search?q=China%20policy%20OR%20economy&hl=en-US&gl=US&ceid=US:en
    role: discovery
    tier: 3
    bundle: china
    module: information
    category: domestic
    language: en
    region: cn
  - id: rand_research
    article_patterns: ['^https://www\.rand\.org/pubs/(?:[^/]+/)+[^/?#]+\.html']
    name: RAND Research
    url: https://www.rand.org/pubs.html
    feed_urls: [https://www.rand.org/pubs.xml]
    role: evidence
    tier: 1
    bundle: geopolitics
    module: information
    category: military
    language: en
    region: us

  # AI, software engineering, and the broader technology ecosystem.
  - id: github_blog
    article_patterns: ['^https://github\.blog/(?!category/|tag/|author/)(?:[^/?#]+/)+[^/?#]+-[^/?#]+/?(?:[?#]|$)']
    name: GitHub Blog
    url: https://github.blog/
    feed_urls: [https://github.blog/feed/]
    role: primary
    tier: 1
    bundle: ai
    module: technology
    category: news
    language: en
    region: global
  - id: huggingface_blog
    name: Hugging Face Blog
    url: https://huggingface.co/blog
    feed_urls: [https://huggingface.co/blog/feed.xml]
    role: primary
    tier: 1
    bundle: ai
    module: technology
    category: news
    language: en
    region: global

  # Research publications.
  - id: nature_news
    article_patterns: ['^https://www\.nature\.com/articles/[^/?#]+']
    name: Nature
    url: https://www.nature.com/nature/articles
    feed_urls: [https://www.nature.com/nature.rss]
    role: evidence
    tier: 1
    bundle: research
    module: technology
    category: papers
    language: en
    region: global
  - id: cna_mainland
    name: 中央社两岸
    url: https://www.cna.com.tw/list/acn.aspx
    include_domains: [cna.com.tw]
    article_patterns: ['^https://www\.cna\.com\.tw/news/acn/\d+\.aspx$']
    feed_urls:
    - https://feeds.feedburner.com/rsscna/mainland
    enabled: true
    role: discovery
    tier: 2
    bundle: geopolitics
    module: information
    category: domestic
    language: zh-CN
    region: tw
    origin_scope: tw
    coverage_regions:
    - tw
    publisher_group: cna_taiwan
    report_target: 0
    report_max: 0
    refresh_interval_minutes: 30
  - id: boj_news
    name: Bank of Japan
    url: https://www.boj.or.jp/en/
    article_patterns: ['^https?://www\.boj\.or\.jp/en/[^?#]+']
    exclude_patterns:
    - '^https?://www\.boj\.or\.jp/en/(?:[^/?#]+/){0,2}index\.htm(?:[?#]|$)'
    - '^https?://www\.boj\.or\.jp/en/(?:mailing|snspolicy)\.htm(?:[?#]|$)'
    - '^https?://www\.boj\.or\.jp/en/(?:about/(?:outline|organization|activities|services)|mopo/outline|paym/outline|note_tfjgs)/'
    - '^https?://www\.boj\.or\.jp/en/(?:mopo/(?:mpmsche_minu|measures|mpmdeci)|paym/market|research/brp|statistics/outline)/(?:[^/?#]+/)+index\.htm(?:[?#]|$)'
    feed_urls:
    - https://www.boj.or.jp/en/rss/whatsnew.xml
    enabled: true
    role: discovery
    tier: 1
    bundle: markets
    module: information
    category: market
    language: en
    region: jp
    origin_scope: jp
    coverage_regions:
    - jp
    publisher_group: boj_news
    report_target: 0
    report_max: 0
    refresh_interval_minutes: 60
  - id: rthk_finance_alt
    name: 香港电台财经
    url: https://news.rthk.hk/rthk/ch/news-programmes.htm
    include_domains: [news.rthk.hk]
    article_patterns: ['^https://news\.rthk\.hk/rthk/ch/component/k2/\d+-\d{8}\.htm$']
    feed_urls:
    - https://rthk.hk/rthk/news/rss/c_expressnews_cfinance.xml
    enabled: true
    role: discovery
    tier: 2
    bundle: markets
    module: information
    category: market
    language: zh-CN
    region: hk
    origin_scope: hk
    coverage_regions:
    - hk
    publisher_group: rthk_finance_alt
    report_target: 0
    report_max: 0
    refresh_interval_minutes: 30
