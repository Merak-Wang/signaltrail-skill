sources:
  # Global and regional news. These sources expand discovery only; they never
  # create per-source quotas in the morning or evening newspaper.
  - id: un_news
    name: UN News
    url: https://news.un.org/en/
    feed_urls: [https://news.un.org/feed/subscribe/en/news/all/rss.xml]
    role: primary
    tier: 1
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: international_organization
    coverage_regions: [global]
    publisher_group: united_nations
  - id: al_jazeera
    name: Al Jazeera
    url: https://www.aljazeera.com/
    feed_urls: [https://www.aljazeera.com/xml/rss/all.xml]
    role: evidence
    tier: 1
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: qa
    coverage_regions: [middle_east, global]
    publisher_group: al_jazeera
  # Public endpoints probed on 2026-09-20; discovery only, no brief quotas.
  - id: tass_en
    name: TASS English
    url: https://tass.com/
    feed_urls: [https://tass.com/rss/v2.xml]
    include_domains: [tass.com]
    article_patterns: ['^https://tass\.com/[a-z-]+/\d+$']
    role: evidence
    tier: 2
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: ru
    coverage_regions: [ru, global]
    publisher_group: tass
  - id: cbr_en
    name: Bank of Russia
    url: https://www.cbr.ru/eng/about/rss/
    feed_urls:
      - https://www.cbr.ru/rss/EngRssPress
      - https://www.cbr.ru/rss/EngRssNews
    include_domains: [cbr.ru]
    role: primary
    tier: 1
    bundle: markets
    module: information
    category: market
    language: en
    region: ru
    origin_scope: ru
    coverage_regions: [ru]
    publisher_group: bank_of_russia
    refresh_interval_minutes: 60
  - id: xinhua_en
    name: Xinhua English
    url: https://english.news.cn/
    include_domains: [english.news.cn]
    article_patterns: ['^https://english\.news\.cn/(?:[a-z]+/)?\d{8}/[a-f0-9]+/c\.html$']
    role: evidence
    tier: 2
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: cn
    coverage_regions: [cn, global]
    publisher_group: xinhua
  - id: china_mfa
    name: China MFA Spokesperson Remarks
    url: https://www.fmprc.gov.cn/eng/xw/fyrbt/
    include_domains: [fmprc.gov.cn]
    article_patterns: ['^https://www\.fmprc\.gov\.cn/eng/xw/fyrbt/(?:[^/]+/)?\d{6}/t\d{8}_\d+\.html$']
    role: primary
    tier: 1
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: cn
    origin_scope: cn
    coverage_regions: [cn, global]
    publisher_group: china_mfa
    refresh_interval_minutes: 60
  - id: china_mofcom
