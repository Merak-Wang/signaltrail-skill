sources:
  # Global and regional news. Enabled sources enter existing report sections.
  # Each source retains all current-day items in its own publisher Top order.
  - id: un_news
    name: UN News
    url: https://news.un.org/en/
    feed_urls: [https://news.un.org/feed/subscribe/en/news/all/rss.xml]
    role: primary
    tier: 1
    bundle: geopolitics
    module: information
    category: international
    language: en
    region: global
    origin_scope: international_organization
    coverage_regions: [global]
    publisher_group: united_nations
  - id: al_jazeera
    name: Al Jazeera
    url: https://www.aljazeera.com/
    feed_urls: [https://www.aljazeera.com/xml/rss/all.xml]
