    include_domains: [mofcom.gov.cn]
    article_patterns: ['^https://www\.mofcom\.gov\.cn/xwfbzt/\d{4}/swbzklxxwfbh[^/]+/index\.html$']
    role: primary
    tier: 1
    bundle: markets
    module: information
    category: market
    language: zh
    region: cn
    origin_scope: cn
    coverage_regions: [cn, global]
