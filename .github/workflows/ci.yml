name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Verify packaged entry points
        run: |
          python scripts/build_hermes_skill.py --output output/package/signaltrail
          python output/package/signaltrail/scripts/run_signaltrail.py --help
          python output/package/signaltrail/scripts/run_codex_edition.py --help
      - name: Module quality and performance
        run: python scripts/evaluate_modules.py --repeat 3 --output output/module-evaluation/results.json
      - name: Save module evaluation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/module-evaluation/
      - name: Compile package
        run: python -m compileall -q src scripts evals
      - name: Code documentation
        run: python scripts/check_code_comments.py
      - name: Documentation links and translations
        run: python scripts/check_docs.py
      - name: Whitespace
        run: git diff --check
