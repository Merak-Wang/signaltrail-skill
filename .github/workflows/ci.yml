name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Prepare FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Prepare FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
              [Environment]::GetEnvironmentVariable('Path', 'User')
          }
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          Split-Path $ffmpeg | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ruff
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest
      - name: Compile package
        run: python -m compileall -q src tests scripts
      - name: Code documentation
        run: python scripts/check_code_comments.py
      - name: Documentation links and translations
        run: python scripts/check_docs.py
      - name: Whitespace
        run: git diff --check
