[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signaltrail-skill"
version = "2.1.0"
description = "SignalTrail: local news monitoring, source-traceable daily reports, animated news presentations, and narrated video."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Wang Mingfeng"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "Pillow>=10,<13",
  "pypdf>=5,<7",
  "playwright>=1.50,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "reportlab>=4.2,<5",
  "Send2Trash[win32]>=1.8.3,<2",
  "tiktoken>=0.12,<1",
  "tzdata>=2024.1",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
dev = [ "pytest>=8.3,<9", "ruff>=0.9,<1"]
crawl4ai = ["crawl4ai>=0.9,<1"]

[project.scripts]
signaltrail = "signaltrail.cli:main"
signaltrail-usage = "signaltrail.usage_cli:main"
signaltrail-hermes = "signaltrail.hermes_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
signaltrail = ["native/*.cpp"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
